# 已结束维护（EOM）的文档版本目录名清单，用于在文档页顶部展示"停止维护"提示横幅。
# 版本目录名与 content/{zh,en}/docs/<version> 以及 URL 中的版本段保持一致（lite 版会先去掉 -lite 后缀再匹配）。
# 该清单需与 static/js/version-data.js 中 state: "EOM" 的版本保持同步。
# 注意：必须加引号，否则 YAML 会把 3.1.0 这类含点号的版本号解析成浮点数，导致模板字符串比对失败。
- "3.1.1"
- "3.1.0"
- "2.1.0"
- "2.0.1"
- "1.1.0"
- "1.0.1"
- "1.0.0"
